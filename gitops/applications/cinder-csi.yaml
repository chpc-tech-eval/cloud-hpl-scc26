
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinder-csi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/cloud-provider-openstack
      chart: openstack-cinder-csi
      targetRevision: 2.36.5
      helm:
        releaseName: openstack-cinder-csi
        valueFiles:
          - $values/gitops/resources/cinder-csi/values.yaml
    - repoURL: https://github.com/chpc-tech-eval/cloud-hpl-scc26.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
