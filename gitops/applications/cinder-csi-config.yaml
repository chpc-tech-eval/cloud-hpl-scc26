apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinder-csi-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chpc-tech-eval/cloud-hpl-scc26.git
    targetRevision: dev
    path: gitops/resources/cinder-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
