apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chpc-tech-eval/cloud-hpl-scc26.git
    targetRevision: dev
    path: gitops/resources/wazuh-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
