apiVersion: v1
kind: Secret
metadata:
  name: cloud-config
  namespace: kube-system
type: Opaque
stringData:
  cloud.conf: |
    [Global]
    auth-url = <OPENSTACK_KEYSTONE_V3_URL>
    region = <OPENSTACK_REGION>
    auth-type = v3applicationcredential
    application-credential-id = <APPLICATION_CREDENTIAL_ID>
    application-credential-secret = <APPLICATION_CREDENTIAL_SECRET>

    [BlockStorage]
    bs-version = v3
