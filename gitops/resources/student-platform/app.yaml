apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-platform
  namespace: student-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: student-platform }
  template:
    metadata:
      labels: { app: student-platform }
    spec:
      # imagePullSecrets:            # uncomment only if the GHCR package is private
      #   - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/chpc-tech-eval/cloud-hpl-scc26/student-platform@sha256:dda2796eebb8ee89f80fe2b679f22c9cac2ee85ccf12b6593cf1cde5d0245bb6
          ports:
            - containerPort: 8080
          env:
            - { name: TEAM_NAME, value: "CPUT CD Spears" }
            - { name: TEAM_SLUG, value: "cput-cd-spears" }
            - { name: GIT_SHA, value: " 4cdf177" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: student-platform-secrets, key: DATABASE_URL }
            - name: REGISTRATION_CODE
              valueFrom:
                secretKeyRef: { name: student-platform-secrets, key: REGISTRATION_CODE }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: student-platform
  namespace: student-platform
spec:
  selector: { app: student-platform }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-platform
  namespace: student-platform
  annotations:
    cert-manager.io/cluster-issuer: ingress-test-selfsigned
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["student-platform.local"]
      secretName: student-platform-tls
  rules:
    - host: student-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: student-platform
                port: { number: 80 }